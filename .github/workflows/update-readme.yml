name: Refresh publications

# Copy this file to .github/workflows/ in the repo that holds your README,
# and copy automation/update_readme.py next to it (repo root).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, catches new arXiv papers
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Don't re-trigger on the bot's own commit.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate publications table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          ARXIV_AUTHOR: ${{ vars.ARXIV_AUTHOR }}
        run: python3 automation/update_readme.py

      - name: Propose the refreshed table as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "Junhyung Kim"
          git config user.email "77619620+kjhyung@users.noreply.github.com"
          branch="automation/readme-refresh"
          git checkout -B "$branch"
          git add README.md
          git commit -m "docs: refresh publications table"
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base main --head "$branch" \
            --title "docs: refresh publications table" \
            --body "Automated refresh of the publications table and current-work block."
          fi
